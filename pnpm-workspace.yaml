packages:
  - apps/*
  - packages/*

# サプライチェーン攻撃対策: 公開から14日未満のバージョンをインストールしない
minimumReleaseAge: 20160

# ビルドスクリプトの実行可否
allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
  sharp: false
  workerd: true

# 親パッケージが脆弱なバージョンに固定している推移的依存を、互換範囲内のパッチ済みバージョンへ引き上げる
overrides:
  # @pandacss/core が postcss@8.5.14 / browserslist@4.28.1 に固定しているため
  postcss: ^8.5.18
  browserslist: ^4.28.7
  # miniflare が sharp@0.35.4 に固定しているため
  sharp: ^0.35.5
  # solid-js@1.9.11 は seroval@~1.5 に固定されているうえ、@tanstack/devtools-ui@0.7 が使う `use` を export していないため
  solid-js: ^1.9.17
